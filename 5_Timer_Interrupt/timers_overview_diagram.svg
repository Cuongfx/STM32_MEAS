<svg width="1100" height="920" viewBox="0 0 1100 920" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How TIM3, TIM6, and TIM4 work together for one HC-SR04 measurement cycle</title>
<desc>TIM6 fires an Update interrupt every 60ms which schedules a new measurement. The main loop then fires a 10us Trigger pulse timed by TIM3's free-running 1-microsecond counter. The Echo pin's EXTI interrupt reads that same TIM3 counter on the rising and falling edge to time the echo pulse width. The resulting distance is converted into a PWM duty cycle written to TIM4, which drives the LED brightness continuously in hardware.</desc>
<rect width="1100" height="920" fill="#ffffff"/>

<text x="550" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">How TIM3, TIM6 and TIM4 work together for one measurement cycle</text>

<!-- ================= Section A: TIM6 macro timeline ================= -->
<text x="60" y="70" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">TIM6 — measurement scheduler</text>

<line x1="150" y1="90" x2="750" y2="90" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="150" y1="85" x2="150" y2="95" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="750" y1="85" x2="750" y2="95" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="450" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">60 ms — TIM6 Update period</text>

<line x1="150" y1="100" x2="150" y2="120" stroke="#2f6fed" stroke-width="2"/>
<circle cx="150" cy="110" r="4" fill="#2f6fed"/>
<line x1="150" y1="120" x2="150" y2="140" stroke="#2f6fed" stroke-width="1.5"/>
<text x="150" y="155" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#2f6fed">Update IT</text>
<text x="150" y="168" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#2f6fed">measurement_pending = 1</text>

<line x1="750" y1="100" x2="750" y2="120" stroke="#2f6fed" stroke-width="2"/>
<circle cx="750" cy="110" r="4" fill="#2f6fed"/>
<line x1="750" y1="120" x2="750" y2="140" stroke="#2f6fed" stroke-width="1.5"/>
<text x="750" y="155" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#2f6fed">next Update IT</text>
<text x="750" y="168" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#2f6fed">(+60ms — cycle repeats)</text>

<!-- funnel lines into the zoom box -->
<line x1="150" y1="140" x2="80" y2="192" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="150" y1="140" x2="650" y2="192" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>

<!-- ================= Section B: zoomed detail of one cycle ================= -->
<rect x="80" y="192" width="570" height="268" rx="6" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
<text x="95" y="208" font-family="sans-serif" font-size="10" font-style="italic" fill="#777777">zoomed in — a 10µs Trig pulse and a ~ms-scale Echo pulse, not to scale against the 60ms above</text>

<!-- TRIG lane -->
<text x="95" y="246" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1a1a1a">TRIG (PB0)</text>
<line x1="195" y1="254" x2="280" y2="254" stroke="#1a1a1a" stroke-width="2"/>
<line x1="280" y1="254" x2="280" y2="234" stroke="#1a1a1a" stroke-width="2"/>
<line x1="280" y1="234" x2="310" y2="234" stroke="#1a1a1a" stroke-width="2"/>
<line x1="310" y1="234" x2="310" y2="254" stroke="#1a1a1a" stroke-width="2"/>
<line x1="310" y1="254" x2="600" y2="254" stroke="#1a1a1a" stroke-width="2"/>
<text x="320" y="238" font-family="monospace" font-size="9.5" fill="#2f6fed">delay_us(10) → 10µs pulse</text>

<!-- ECHO lane -->
<text x="95" y="306" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1a1a1a">ECHO (PA1)</text>
<line x1="195" y1="314" x2="330" y2="314" stroke="#1a1a1a" stroke-width="2"/>
<line x1="330" y1="314" x2="330" y2="294" stroke="#16a34a" stroke-width="2.5"/>
<line x1="330" y1="294" x2="530" y2="294" stroke="#16a34a" stroke-width="2.5"/>
<line x1="530" y1="294" x2="530" y2="314" stroke="#16a34a" stroke-width="2.5"/>
<line x1="530" y1="314" x2="600" y2="314" stroke="#1a1a1a" stroke-width="2"/>

<line x1="330" y1="274" x2="330" y2="294" stroke="#2f6fed" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="330" cy="274" r="3.5" fill="#2f6fed"/>
<text x="330" y="266" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#2f6fed">echo_start=CNT</text>

<line x1="530" y1="274" x2="530" y2="294" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="530" cy="274" r="3.5" fill="#c0392b"/>
<text x="530" y="266" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#c0392b">echo_end=CNT</text>

<line x1="330" y1="334" x2="530" y2="334" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="330" y1="329" x2="330" y2="339" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="530" y1="329" x2="530" y2="339" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="430" y="351" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#1a1a1a">T = echo_end − echo_start (µs)</text>

<!-- TIM3 lane -->
<text x="95" y="392" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1a1a1a">TIM3 CNT</text>
<text x="95" y="406" font-family="sans-serif" font-size="9.5" fill="#555555">(free-running, 1µs/tick)</text>
<path d="M195,422 L600,398" fill="none" stroke="#f5a623" stroke-width="2"/>
<text x="400" y="440" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#555555">never reset — the same counter is read by delay_us() above and by the EXTI callback</text>

<!-- ================= calc box ================= -->
<rect x="690" y="230" width="330" height="180" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="710" y="256" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a">Main loop, once echo_captured:</text>
<text x="710" y="282" font-family="monospace" font-size="11.5" fill="#1a1a1a">distance_cm = 0.017 × T</text>
<text x="710" y="304" font-family="monospace" font-size="11.5" fill="#1a1a1a">clamp to 2–400 cm</text>
<text x="710" y="326" font-family="monospace" font-size="11.5" fill="#1a1a1a">duty = f(distance_cm)</text>
<text x="710" y="348" font-family="monospace" font-size="11.5" fill="#1a1a1a">__HAL_TIM_SET_COMPARE(</text>
<text x="726" y="368" font-family="monospace" font-size="11.5" fill="#1a1a1a">&amp;htim4, CH1, duty)</text>

<line x1="650" y1="318" x2="690" y2="318" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="690,318 682,313 682,323" fill="#1a1a1a"/>

<!-- ================= Section C: TIM4 PWM lane ================= -->
<text x="60" y="480" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">TIM4 CH1 (PB6) — 1kHz PWM to LEDY, updated once per cycle</text>

<line x1="855" y1="410" x2="855" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="855,440 850,430 860,430" fill="#1a1a1a"/>
<text x="865" y="430" font-family="sans-serif" font-size="10" fill="#555555">duty written here</text>

<text x="270" y="510" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">object far → low duty</text>
<line x1="120" y1="550" x2="150" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="150" y1="550" x2="150" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="150" y1="530" x2="165" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="165" y1="530" x2="165" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="165" y1="550" x2="210" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="210" y1="550" x2="210" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="210" y1="530" x2="225" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="225" y1="530" x2="225" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="225" y1="550" x2="270" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="270" y1="550" x2="270" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="270" y1="530" x2="285" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="285" y1="530" x2="285" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="285" y1="550" x2="330" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<text x="270" y="575" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">≈15% duty → dim LED</text>

<text x="700" y="510" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">object near → high duty</text>
<line x1="560" y1="550" x2="580" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="580" y1="550" x2="580" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="580" y1="530" x2="640" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="640" y1="530" x2="640" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="640" y1="550" x2="650" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="650" y1="550" x2="650" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="650" y1="530" x2="710" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="710" y1="530" x2="710" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="710" y1="550" x2="720" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="720" y1="550" x2="720" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="720" y1="530" x2="780" y2="530" stroke="#1a1a1a" stroke-width="2"/>
<line x1="780" y1="530" x2="780" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<line x1="780" y1="550" x2="800" y2="550" stroke="#1a1a1a" stroke-width="2"/>
<text x="670" y="575" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">≈75% duty → bright LED</text>

<!-- ================= Section D: three summary columns ================= -->
<line x1="40" y1="605" x2="1060" y2="605" stroke="#cccccc" stroke-width="1"/>

<rect x="40" y="625" width="330" height="270" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="60" y="651" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">TIM3 — shared 1µs timebase</text>
<text x="60" y="675" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">Free-running counter, never reset, no</text>
<text x="60" y="691" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">interrupt — just a live clock other code reads.</text>
<text x="60" y="715" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• delay_us() uses it to time the 10µs pulse</text>
<text x="60" y="733" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• EXTI callback uses it to timestamp Echo</text>
<line x1="60" y1="749" x2="350" y2="749" stroke="#cccccc" stroke-width="1"/>
<text x="60" y="771" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1a1a1a">Why PSC=89, ARR=65535:</text>
<text x="60" y="791" font-family="monospace" font-size="10.5" fill="#1a1a1a">90MHz / 90 = 1MHz → 1µs/tick</text>
<text x="60" y="809" font-family="sans-serif" font-size="10" fill="#555555">(clean µs math, no unit conversion needed)</text>
<text x="60" y="831" font-family="monospace" font-size="10.5" fill="#1a1a1a">ARR=65535 (max) → wraps after 65.5ms</text>
<text x="60" y="849" font-family="sans-serif" font-size="10" fill="#555555">must outlast the ~38ms no-echo timeout</text>
<text x="60" y="865" font-family="sans-serif" font-size="10" fill="#555555">and the ~23ms echo for a 400cm reading</text>

<rect x="385" y="625" width="330" height="270" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="405" y="651" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">TIM6 — 60ms scheduler</text>
<text x="405" y="675" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">Drives no pin — only its Update interrupt</text>
<text x="405" y="691" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">matters: it sets measurement_pending, and</text>
<text x="405" y="707" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">the main loop fires the next Trig pulse.</text>
<line x1="405" y1="723" x2="695" y2="723" stroke="#cccccc" stroke-width="1"/>
<text x="405" y="745" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1a1a1a">Why it exists at all:</text>
<text x="405" y="765" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">HC-SR04 needs ≥60ms between triggers, or</text>
<text x="405" y="781" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">the previous echo hasn't fully died out yet</text>
<text x="405" y="797" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">and can corrupt the next reading.</text>
<line x1="405" y1="813" x2="695" y2="813" stroke="#cccccc" stroke-width="1"/>
<text x="405" y="833" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1a1a1a">Why PSC=8999, ARR=599:</text>
<text x="405" y="853" font-family="monospace" font-size="10.5" fill="#1a1a1a">90MHz/9000=10kHz → 0.1ms/tick</text>
<text x="405" y="871" font-family="monospace" font-size="10.5" fill="#1a1a1a">0.1ms × 600 = 60ms Update period</text>

<rect x="730" y="625" width="330" height="270" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="750" y="651" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">TIM4 CH1 — 1kHz LED PWM</text>
<text x="750" y="675" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">Hardware keeps generating the PWM signal</text>
<text x="750" y="691" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">on its own — the CPU only rewrites the CCR</text>
<text x="750" y="707" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">(duty) register once per measurement.</text>
<line x1="750" y1="723" x2="1040" y2="723" stroke="#cccccc" stroke-width="1"/>
<text x="750" y="745" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1a1a1a">Why PSC=89, ARR=999:</text>
<text x="750" y="765" font-family="monospace" font-size="10.5" fill="#1a1a1a">90MHz/90=1MHz, /1000 steps = 1kHz</text>
<text x="750" y="785" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">1000 duty steps → smooth brightness.</text>
<text x="750" y="805" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">1kHz is far above the ~50-60Hz flicker</text>
<text x="750" y="821" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">threshold, so it reads as steady brightness,</text>
<text x="750" y="837" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">not blinking.</text>
</svg>
