<svg width="1000" height="570" viewBox="0 0 1000 570" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HC-SR04 timing diagram and how TIM3 + the Echo EXTI interrupt measure the pulse width</title>
<desc>Trigger is held high for at least 10 microseconds, which makes the sensor emit an 8-cycle 40kHz ultrasonic burst. Echo goes high right after the burst starts and stays high until the reflected wave returns (or a timeout), so the Echo high time T is proportional to the round-trip distance. TIM3 is a free-running 1-microsecond counter; the EXTI interrupt on the Echo pin reads TIM3's counter on the rising edge (echo_start) and again on the falling edge (echo_end), and T = echo_end - echo_start. TIM6 fires once, at the very start of the cycle, to kick off the trigger.</desc>
<rect width="1000" height="570" fill="#ffffff"/>

<!-- ===== Timer activity lane ===== -->
<text x="30" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Timers active</text>

<!-- TIM6: single instantaneous event, aligned exactly with the start of the 10us TRIG pulse
     (PB0 goes HIGH within a few CPU instructions of this interrupt — no real gap) -->
<line x1="300" y1="40" x2="300" y2="58" stroke="#2f6fed" stroke-width="2.5"/>
<circle cx="300" cy="40" r="4" fill="#2f6fed"/>
<rect x="263" y="14" width="74" height="18" rx="9" fill="#2f6fed"/>
<text x="300" y="27" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">TIM6 IT (t=0)</text>

<!-- TIM3: always ticking (light bar) -->
<rect x="140" y="60" width="760" height="20" rx="3" fill="#fde8cf"/>
<text x="905" y="74" font-family="sans-serif" font-size="9.5" fill="#b8791a">always counting</text>

<!-- TIM3 usage ① — read during the 10us TRIG pulse -->
<rect x="300" y="60" width="30" height="20" rx="2" fill="#d97706"/>
<rect x="272" y="88" width="86" height="18" rx="9" fill="#d97706"/>
<text x="315" y="101" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#ffffff">TIM3 ① 10µs</text>

<!-- TIM3 usage ② — read on both ECHO edges, spans T -->
<rect x="340" y="60" width="300" height="20" rx="2" fill="#d97706"/>
<rect x="447" y="88" width="86" height="18" rx="9" fill="#d97706"/>
<text x="490" y="101" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#ffffff">TIM3 ② T µs</text>

<!-- next TIM6 cycle hint: the whole pulse sequence below is over in ~tens of µs, but the
     next TIM6 Update interrupt (next trigger) only happens 60ms after this one — a scale
     break "//" marks that this line is NOT drawn to scale -->
<line x1="340" y1="40" x2="645" y2="40" stroke="#2f6fed" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="646" y1="34" x2="656" y2="46" stroke="#2f6fed" stroke-width="1.5"/>
<line x1="653" y1="34" x2="663" y2="46" stroke="#2f6fed" stroke-width="1.5"/>
<line x1="664" y1="40" x2="900" y2="40" stroke="#2f6fed" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="900" cy="40" r="4" fill="#2f6fed"/>
<text x="900" y="27" text-anchor="end" font-family="monospace" font-size="10" fill="#2f6fed">TIM6 Update period = 60ms</text>
<text x="900" y="14" text-anchor="end" font-family="sans-serif" font-size="9" fill="#2f6fed">(this line is NOT to scale — see the break "//")</text>

<!-- Trigger row -->
<text x="30" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">TRIG (PB0)</text>
<line x1="140" y1="160" x2="300" y2="160" stroke="#1a1a1a" stroke-width="2"/>
<line x1="300" y1="160" x2="300" y2="135" stroke="#1a1a1a" stroke-width="2"/>
<line x1="300" y1="135" x2="330" y2="135" stroke="#1a1a1a" stroke-width="2"/>
<line x1="330" y1="135" x2="330" y2="160" stroke="#1a1a1a" stroke-width="2"/>
<line x1="330" y1="160" x2="900" y2="160" stroke="#1a1a1a" stroke-width="2"/>
<text x="315" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2f6fed" font-weight="700">10µs pulse</text>

<!-- burst duration bracket -->
<line x1="340" y1="205" x2="436" y2="205" stroke="#f5a623" stroke-width="1.5"/>
<line x1="340" y1="200" x2="340" y2="210" stroke="#f5a623" stroke-width="1.5"/>
<line x1="436" y1="200" x2="436" y2="210" stroke="#f5a623" stroke-width="1.5"/>
<text x="388" y="193" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#b8791a">≈200µs (8 × 25µs @ 40kHz)</text>

<!-- Ultrasonic burst row -->
<text x="30" y="230" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Sensor emits</text>
<text x="30" y="246" font-family="sans-serif" font-size="11" fill="#555555">(8 cycles @ 40kHz)</text>
<line x1="140" y1="255" x2="340" y2="255" stroke="#1a1a1a" stroke-width="2"/>
<path d="M340,255 l6,-14 l6,14 l6,-14 l6,14 l6,-14 l6,14 l6,-14 l6,14 l6,-14 l6,14 l6,-14 l6,14 l6,-14 l6,14 l6,-14 l6,14"
      fill="none" stroke="#f5a623" stroke-width="2"/>
<line x1="436" y1="255" x2="900" y2="255" stroke="#1a1a1a" stroke-width="2"/>

<!-- Echo row -->
<text x="30" y="350" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">ECHO (PA1)</text>
<line x1="140" y1="360" x2="340" y2="360" stroke="#1a1a1a" stroke-width="2"/>
<line x1="340" y1="360" x2="340" y2="320" stroke="#16a34a" stroke-width="2.5"/>
<line x1="340" y1="320" x2="640" y2="320" stroke="#16a34a" stroke-width="2.5"/>
<line x1="640" y1="320" x2="640" y2="360" stroke="#16a34a" stroke-width="2.5"/>
<line x1="640" y1="360" x2="900" y2="360" stroke="#1a1a1a" stroke-width="2"/>

<!-- EXTI callout arrows -->
<line x1="340" y1="300" x2="340" y2="320" stroke="#2f6fed" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="340" cy="300" r="4" fill="#2f6fed"/>
<text x="340" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#2f6fed">echo_start = CNT</text>
<text x="340" y="275" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2f6fed">(EXTI rising edge)</text>

<line x1="640" y1="300" x2="640" y2="320" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="640" cy="300" r="4" fill="#c0392b"/>
<text x="640" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b">echo_end = CNT</text>
<text x="640" y="275" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c0392b">(EXTI falling edge)</text>

<!-- T bracket -->
<line x1="340" y1="390" x2="640" y2="390" stroke="#1a1a1a" stroke-width="2"/>
<line x1="340" y1="384" x2="340" y2="396" stroke="#1a1a1a" stroke-width="2"/>
<line x1="640" y1="384" x2="640" y2="396" stroke="#1a1a1a" stroke-width="2"/>
<text x="490" y="412" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#1a1a1a">T = echo_end - echo_start  (µs, read off TIM3's free-running counter)</text>
<text x="490" y="430" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#16a34a">T is NOT fixed — it varies with distance. Datasheet range: T ≈ 118µs (2cm) … 23.5ms (400cm); ≈38ms if no echo (timeout)</text>

<!-- formula box -->
<rect x="140" y="440" width="760" height="110" rx="10" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="160" y="466" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Distance formula</text>
<text x="160" y="490" font-family="monospace" font-size="13" fill="#1a1a1a">S = v × T / 2 = 340 m/s × (100 cm/m) / 1,000,000 (µs/s) × T / 2 = 0.017 × T   (cm)</text>
<text x="160" y="514" font-family="sans-serif" font-size="11.5" fill="#555555">v = speed of sound (340 m/s). T is halved because the sound travels to the object and back — S is a one-way distance.</text>
<text x="160" y="534" font-family="sans-serif" font-size="11.5" fill="#555555">TIM3 never stops or resets between measurements: it is the same shared 1µs timebase used by delay_us() to generate the 10µs trigger pulse.</text>
</svg>
