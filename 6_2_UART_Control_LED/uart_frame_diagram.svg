<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>UART frame for the letter 'a' (0x61) and the instant the RXNE flag is raised</title>
<desc>A digital waveform showing one 8N1 UART frame carrying the letter 'a', which is the byte 0x61 (binary 0110 0001). The line idles high, a start bit pulls it low, eight data bits follow least-significant-bit first (1 0 0 0 0 1 1 0), then a stop bit returns the line high. While the frame is on the wire the USART1 hardware shifts the bits in on its own and the CPU keeps running the main loop. Only when the stop bit ends does the completed byte land in the DR register and the RXNE flag rise, which raises the interrupt request.</desc>
<rect width="1000" height="520" fill="#ffffff"/>

<defs>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="500" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">One keystroke on the wire — the letter 'a'</text>
<text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">'a' = 0x61 = 0110 0001, sent least-significant bit first, 8N1 at 115200 baud</text>

<!-- ============ frame span bracket ============ -->
<path d="M180 142 L180 132 L780 132 L780 142" fill="none" stroke="#777777" stroke-width="1"/>
<text x="480" y="124" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#555555">one frame = 10 bit times ≈ 87 µs</text>

<!-- ============ bit-slot separators ============ -->
<line x1="180" y1="160" x2="180" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="240" y1="160" x2="240" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="300" y1="160" x2="300" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="360" y1="160" x2="360" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="420" y1="160" x2="420" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="480" y1="160" x2="480" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="540" y1="160" x2="540" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="600" y1="160" x2="600" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="660" y1="160" x2="660" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="720" y1="160" x2="720" y2="272" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>

<!-- ============ waveform: idle, start(0), 1 0 0 0 0 1 1 0, stop(1) ============ -->
<text x="110" y="174" text-anchor="end" font-family="sans-serif" font-size="10" fill="#777777">3.3V</text>
<text x="110" y="244" text-anchor="end" font-family="sans-serif" font-size="10" fill="#777777">0V</text>
<polyline points="120,170 180,170 180,240 240,240 240,170 300,170 300,240 540,240 540,170 660,170 660,240 720,240 720,170 880,170" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

<text x="150" y="288" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#777777">idle</text>
<text x="210" y="288" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2f6fed">start</text>
<text x="270" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">1</text>
<text x="330" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">0</text>
<text x="390" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">0</text>
<text x="450" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">0</text>
<text x="510" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">0</text>
<text x="570" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">1</text>
<text x="630" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">1</text>
<text x="690" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">0</text>
<text x="750" y="288" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2f6fed">stop</text>
<text x="830" y="288" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#777777">idle</text>

<text x="270" y="304" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#777777">b0</text>
<text x="330" y="304" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#777777">b1</text>
<text x="390" y="304" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#777777">b2</text>
<text x="450" y="304" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#777777">b3</text>
<text x="510" y="304" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#777777">b4</text>
<text x="570" y="304" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#777777">b5</text>
<text x="630" y="304" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#777777">b6</text>
<text x="690" y="304" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#777777">b7</text>

<!-- ============ the instant that matters ============ -->
<line x1="780" y1="160" x2="780" y2="348" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<circle cx="780" cy="170" r="4" fill="#c0392b"/>

<!-- ============ two cards ============ -->
<rect x="60" y="350" width="420" height="120" rx="8" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.5"/>
<text x="80" y="376" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a">While the 10 bits are on the wire</text>
<text x="80" y="400" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• The USART1 hardware shifts every bit in by itself</text>
<text x="80" y="420" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• It checks the start bit, counts, checks the stop bit</text>
<text x="80" y="440" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• The CPU is elsewhere, still running while(1)</text>
<text x="80" y="460" font-family="sans-serif" font-size="10.5" fill="#555555">No software is involved for the whole 87 µs.</text>

<rect x="540" y="350" width="400" height="120" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="560" y="376" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#c0392b">The instant the stop bit ends</text>
<text x="560" y="400" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• The finished byte 0x61 lands in register DR</text>
<text x="560" y="420" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• Hardware raises RXNE in register SR</text>
<text x="560" y="440" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• The interrupt request goes out to the NVIC</text>
<text x="560" y="460" font-family="sans-serif" font-size="10.5" fill="#555555">From here the byte is just the number 97.</text>
</svg>
