<svg width="1000" height="870" viewBox="0 0 1000 870" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The chain from the RXNE hardware flag to the user callback</title>
<desc>Six stages in sequence. The USART1 peripheral raises the RXNE flag; the NVIC passes interrupt line 37 through if it is enabled; the core reads vector table slot 53 in the startup file and jumps to the address stored there; that address is USART1_IRQHandler in stm32f4xx_it.c; it calls HAL_UART_IRQHandler, which reads the registers and decides what happened; and that finally calls HAL_UART_RxCpltCallback, the weak hook the application overrides to decide what to do about it. Colour marks which stages are hardware, which are generated by CubeMX and HAL, and which the application author writes.</desc>
<rect width="1000" height="870" fill="#ffffff"/>

<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="500" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">From a bit on the wire to your callback</text>
<text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">Nothing in your code calls the callback — this is the chain that does</text>

<!-- ============ 1 ============ -->
<circle cx="252" cy="122" r="11" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.2"/>
<text x="252" y="126" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#555555">1</text>
<rect x="280" y="90" width="440" height="64" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="300" y="116" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#c0392b">USART1 peripheral</text>
<text x="300" y="136" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">sets the RXNE flag in register SR</text>
<text x="745" y="126" font-family="sans-serif" font-size="10.5" fill="#777777">≈ 87 µs after the first bit</text>
<line x1="500" y1="154" x2="500" y2="188" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- ============ 2 ============ -->
<circle cx="252" cy="222" r="11" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.2"/>
<text x="252" y="226" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#555555">2</text>
<rect x="280" y="190" width="440" height="64" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="300" y="216" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#c0392b">NVIC — interrupt line 37</text>
<text x="300" y="236" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">passes the request through only if the line is enabled</text>
<text x="745" y="226" font-family="sans-serif" font-size="10.5" fill="#777777">switch 2 of 3, see below</text>
<line x1="500" y1="254" x2="500" y2="288" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- ============ 3 ============ -->
<circle cx="252" cy="322" r="11" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.2"/>
<text x="252" y="326" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#555555">3</text>
<rect x="280" y="290" width="440" height="64" rx="8" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.5"/>
<text x="300" y="316" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a">Vector table, slot 53</text>
<text x="300" y="336" font-family="monospace" font-size="10.5" fill="#555555">startup_stm32f446retx.s</text>
<text x="745" y="320" font-family="sans-serif" font-size="10.5" fill="#777777">16 system vectors + IRQ 37</text>
<text x="745" y="336" font-family="monospace" font-size="10.5" fill="#777777">→ 0x080000D4</text>
<line x1="500" y1="354" x2="500" y2="388" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- ============ 4 ============ -->
<circle cx="252" cy="422" r="11" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.2"/>
<text x="252" y="426" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#555555">4</text>
<rect x="280" y="390" width="440" height="64" rx="8" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.5"/>
<text x="300" y="416" font-family="monospace" font-size="13.5" font-weight="700" fill="#1a1a1a">USART1_IRQHandler()</text>
<text x="300" y="436" font-family="monospace" font-size="10.5" fill="#555555">Core/Src/stm32f4xx_it.c</text>
<text x="745" y="426" font-family="sans-serif" font-size="10.5" fill="#777777">generated only if ticked</text>
<line x1="500" y1="454" x2="500" y2="488" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- ============ 5 ============ -->
<circle cx="252" cy="522" r="11" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.2"/>
<text x="252" y="526" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#555555">5</text>
<rect x="280" y="490" width="440" height="64" rx="8" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.5"/>
<text x="300" y="516" font-family="monospace" font-size="13.5" font-weight="700" fill="#1a1a1a">HAL_UART_IRQHandler()</text>
<text x="300" y="536" font-family="sans-serif" font-size="10.5" fill="#555555">decides WHAT happened</text>
<text x="745" y="526" font-family="sans-serif" font-size="10.5" fill="#777777">identical in every project</text>
<line x1="500" y1="554" x2="500" y2="588" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/>

<!-- ============ 6 ============ -->
<circle cx="252" cy="622" r="11" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.2"/>
<text x="252" y="626" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#555555">6</text>
<rect x="280" y="590" width="440" height="64" rx="8" fill="#e8f6ec" stroke="#16a34a" stroke-width="1.5"/>
<text x="300" y="616" font-family="monospace" font-size="13.5" font-weight="700" fill="#16a34a">HAL_UART_RxCpltCallback()</text>
<text x="300" y="636" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">decides WHAT TO DO about it</text>
<text x="745" y="620" font-family="sans-serif" font-size="10.5" fill="#777777">a __weak hook — your</text>
<text x="745" y="636" font-family="sans-serif" font-size="10.5" fill="#777777">definition replaces it</text>

<!-- ============ the three switches ============ -->
<rect x="60" y="700" width="880" height="112" rx="8" fill="#fff4e5" stroke="#d97706" stroke-width="1.5"/>
<text x="80" y="726" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#d97706">All three switches must be ON — miss any one and you get silence, with no error message</text>
<text x="80" y="752" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">1.  The RXNEIE bit in USART1->CR1  —  set for you by HAL_UART_Receive_IT()</text>
<text x="80" y="772" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">2.  NVIC line 37 enabled  —  HAL_NVIC_EnableIRQ(), generated from the CubeMX NVIC tab</text>
<text x="80" y="792" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">3.  A real function in vector slot 53  —  USART1_IRQHandler() in stm32f4xx_it.c, same tab</text>

<!-- ============ legend ============ -->
<rect x="280" y="832" width="14" height="14" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="302" y="843" font-family="sans-serif" font-size="10.5" fill="#555555">hardware</text>
<rect x="400" y="832" width="14" height="14" rx="3" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.2"/>
<text x="422" y="843" font-family="sans-serif" font-size="10.5" fill="#555555">generated by CubeMX / HAL</text>
<rect x="620" y="832" width="14" height="14" rx="3" fill="#e8f6ec" stroke="#16a34a" stroke-width="1.2"/>
<text x="642" y="843" font-family="sans-serif" font-size="10.5" fill="#555555">you write this</text>
</svg>
