<svg width="1000" height="450" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CPU time with blocking reception versus interrupt-driven reception</title>
<desc>Two timelines of what the CPU spends its time on. With the blocking HAL_UART_Receive, the CPU sits inside the function waiting for a byte, so the counting loop freezes for the whole wait. With HAL_UART_Receive_IT, the counting loop runs continuously and is only interrupted for the few microseconds the callback takes, after which the CPU resumes exactly where it left off.</desc>
<rect width="1000" height="450" fill="#ffffff"/>

<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="500" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Why reception must be interrupt-driven</text>
<text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">Each bar is one stretch of CPU time — what the processor is actually doing</text>

<!-- ============ Row 1: blocking ============ -->
<rect x="40" y="90" width="210" height="72" rx="8" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.5"/>
<text x="60" y="116" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a">Blocking</text>
<text x="60" y="138" font-family="monospace" font-size="10.5" fill="#555555">HAL_UART_Receive()</text>

<rect x="290" y="106" width="170" height="40" rx="4" fill="#e8f6ec" stroke="#16a34a" stroke-width="1.5"/>
<text x="375" y="131" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">counting</text>

<rect x="460" y="106" width="380" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="650" y="131" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">stuck inside the function, waiting for a byte</text>

<rect x="840" y="106" width="120" height="40" rx="4" fill="#e8f6ec" stroke="#16a34a" stroke-width="1.5"/>
<text x="900" y="131" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">counting</text>

<text x="290" y="180" font-family="sans-serif" font-size="10.5" fill="#c0392b">The counter freezes for the entire wait — you get either counting or listening, never both.</text>

<!-- ============ Row 2: interrupt ============ -->
<rect x="40" y="240" width="210" height="72" rx="8" fill="#f8f9fb" stroke="#cccccc" stroke-width="1.5"/>
<text x="60" y="266" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a">Interrupt</text>
<text x="60" y="288" font-family="monospace" font-size="10.5" fill="#555555">HAL_UART_Receive_IT()</text>

<rect x="290" y="256" width="670" height="40" rx="4" fill="#e8f6ec" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="281" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">counting, without interruption</text>
<rect x="746" y="256" width="14" height="40" fill="#c0392b"/>

<line x1="753" y1="296" x2="753" y2="332" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/>

<rect x="600" y="334" width="360" height="76" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="620" y="360" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#c0392b">The callback runs here</text>
<text x="620" y="382" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">A few microseconds. The CPU then returns to</text>
<text x="620" y="399" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">exactly the instruction it was cut off at.</text>

<text x="40" y="360" font-family="sans-serif" font-size="10.5" fill="#555555">This is why the ISR must stay short:</text>
<text x="40" y="379" font-family="sans-serif" font-size="10.5" fill="#555555">set a flag and leave. Anything slow</text>
<text x="40" y="398" font-family="sans-serif" font-size="10.5" fill="#555555">widens the red slice and can cost you</text>
<text x="40" y="417" font-family="sans-serif" font-size="10.5" fill="#555555">the next incoming byte (ORE).</text>
</svg>
