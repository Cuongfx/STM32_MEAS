<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wiring a CH340G USB-to-UART module to the Nucleo-F446RE</title>
<desc>Three wires connect the two boards. The Nucleo's PA9 (USART1_TX, Arduino header D8) goes to the module's RXD pin; the module's TXD pin goes back to the Nucleo's PA10 (USART1_RX, header D2); and the two GND pins are tied together. The module's 3V3 and 5V output pins are left unconnected because each board is powered from its own USB cable.</desc>
<rect width="700" height="520" fill="#ffffff"/>

<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Wiring — CH340G to Nucleo-F446RE</text>
<text x="350" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">Three wires, plus one USB cable per board</text>

<!-- ============ Nucleo ============ -->
<rect x="40" y="75" width="220" height="300" rx="10" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="150" y="105" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Nucleo-F446RE</text>
<text x="150" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">STM32F446RETx</text>

<text x="248" y="170" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PA9  (D8)</text>
<text x="248" y="186" text-anchor="end" font-family="monospace" font-size="10.5" fill="#555555">USART1_TX</text>

<text x="248" y="225" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PA10  (D2)</text>
<text x="248" y="241" text-anchor="end" font-family="monospace" font-size="10.5" fill="#555555">USART1_RX</text>

<text x="248" y="305" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
<text x="248" y="321" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#555555">power header CN6</text>

<text x="150" y="358" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#777777">powered by its own USB</text>

<!-- ============ CH340G ============ -->
<rect x="440" y="75" width="220" height="300" rx="10" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="550" y="105" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">CH340G module</text>
<text x="550" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">USB ↔ UART bridge</text>

<text x="452" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">RXD</text>
<text x="452" y="186" font-family="sans-serif" font-size="10.5" fill="#555555">module listens here</text>

<text x="452" y="225" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">TXD</text>
<text x="452" y="241" font-family="sans-serif" font-size="10.5" fill="#555555">module talks here</text>

<text x="452" y="305" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>

<text x="452" y="345" font-family="sans-serif" font-size="13" font-weight="700" fill="#777777">3V3 / 5V</text>
<text x="452" y="361" font-family="sans-serif" font-size="10.5" fill="#c0392b">leave unconnected</text>

<!-- ============ wires ============ -->
<text x="346" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2f6fed">PA9 → RXD</text>
<line x1="260" y1="170" x2="432" y2="170" stroke="#2f6fed" stroke-width="2" marker-end="url(#ab)"/>

<text x="346" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d97706">TXD → PA10</text>
<line x1="432" y1="225" x2="260" y2="225" stroke="#d97706" stroke-width="2" marker-end="url(#aa)"/>

<text x="346" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">GND — GND</text>
<line x1="260" y1="305" x2="432" y2="305" stroke="#1a1a1a" stroke-width="2"/>

<!-- ============ notes ============ -->
<rect x="40" y="395" width="620" height="95" rx="8" fill="#fff4e5" stroke="#d97706" stroke-width="1.5"/>
<text x="60" y="420" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#d97706">Three wires only</text>
<text x="60" y="442" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• TX always goes to RX. Wiring TX to TX means both sides talk and neither one listens.</text>
<text x="60" y="462" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• Set the module jumper to 3V3. If TXD still idles at 5V, feed PA10 through a 1kΩ / 2kΩ divider.</text>
<text x="60" y="482" font-family="sans-serif" font-size="10.5" fill="#1a1a1a">• Each board has its own USB cable, so never connect VCC between them — only GND is shared.</text>
</svg>
